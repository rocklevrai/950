<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fjordheim — a Viking village at golden hour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- No build step: Three.js is pulled as ES modules from a CDN, pinned to one version. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root { --ink: #ece6da; --amber: #e8a33d; --dim: rgba(236, 230, 218, .55); --cond: "Barlow Condensed", "Oswald", "Arial Narrow", sans-serif; --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #14100c; color: var(--ink); font-family: var(--cond); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; text-shadow: 0 1px 6px rgba(0, 0, 0, .55); }
    #hud.on { opacity: 1; }
    .label { font-weight: 500; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--amber); }

    #compass { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .6)); }

    #objective { position: absolute; top: max(22px, env(safe-area-inset-top)); left: max(26px, env(safe-area-inset-left)); display: flex; gap: 14px; max-width: 360px; }
    #objective .bar { width: 2px; background: var(--amber); box-shadow: 0 0 10px rgba(232, 163, 61, .5); }
    #obj-title { white-space: nowrap; font-weight: 400; font-size: 23px; letter-spacing: .1em; text-transform: uppercase; margin: 3px 0 9px; line-height: 1.05; }
    #obj-list { list-style: none; }
    #obj-list li { display: flex; gap: 9px; align-items: baseline; font-weight: 300; font-size: 16px; letter-spacing: .07em; text-transform: uppercase; line-height: 1.5; color: var(--ink); transition: color .6s; }
    #obj-list li.done { color: var(--dim); }
    #obj-list li.done span:nth-child(2) { text-decoration: line-through; text-decoration-color: rgba(236, 230, 218, .35); }
    #obj-list .tick { color: var(--amber); font-size: 10px; transform: translateY(-2px); }
    #obj-list .num { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: 0; margin-left: 2px; }

    #toast { position: absolute; top: 24%; left: 0; right: 0; text-align: center; opacity: 0; transform: translateY(8px); transition: opacity .9s ease, transform .9s ease; }
    #toast.show { opacity: 1; transform: none; }
    #toast-sub { font-weight: 500; font-size: 12px; letter-spacing: .5em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; padding-left: .5em; }
    #toast-main { font-weight: 300; font-size: clamp(30px, 5vw, 52px); letter-spacing: .28em; text-transform: uppercase; padding-left: .28em; }
    #toast-main::after { content: ""; display: block; width: 64px; height: 1px; background: var(--amber); margin: 12px auto 0; }

    #prompt { position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity .25s; font-size: 17px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; }
    #prompt.show { opacity: 1; }
    #prompt .key { font-family: var(--mono); font-size: 12px; letter-spacing: 0; color: var(--amber); border: 1px solid var(--amber); padding: 3px 8px 2px; border-radius: 2px; }
    body.mobile #prompt .key { display: none; }

    #lore { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); width: min(620px, 84vw); text-align: center; font-weight: 300; font-size: clamp(18px, 2.3vw, 24px); letter-spacing: .05em; line-height: 1.4; opacity: 0; transition: opacity .8s; padding: 14px 22px; background: linear-gradient(90deg, transparent, rgba(12, 9, 7, .55) 18%, rgba(12, 9, 7, .55) 82%, transparent); }
    #lore.show { opacity: 1; }

    #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(236, 230, 218, .6); box-shadow: 0 0 4px rgba(0, 0, 0, .7); }
    #stats { position: absolute; right: max(18px, env(safe-area-inset-right)); top: max(20px, env(safe-area-inset-top)); font-family: var(--mono); font-size: 10px; color: var(--dim); text-align: right; line-height: 1.6; }
    #stats b { color: var(--amber); font-weight: 500; }

    @media (max-width: 1150px) { #objective { top: calc(max(14px, env(safe-area-inset-top)) + 66px); } #obj-title { font-size: 19px; } #obj-list li { font-size: 14px; line-height: 1.4; } }

    /* touch controls */
    #touch { display: none; }
    body.mobile #touch { display: block; }
    body.mobile #crosshair { opacity: .5; }
    #stick { position: absolute; left: max(26px, env(safe-area-inset-left)); bottom: max(30px, env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; border: 1px solid rgba(236, 230, 218, .28); background: radial-gradient(circle, rgba(20, 16, 12, .1), rgba(20, 16, 12, .38)); pointer-events: auto; backdrop-filter: blur(2px); }
    #nub { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(236, 230, 218, .22); border: 1px solid rgba(236, 230, 218, .5); }
    .btn { position: absolute; width: 66px; height: 66px; border-radius: 50%; border: 1px solid rgba(236, 230, 218, .35); background: rgba(20, 16, 12, .34); color: var(--ink); font-family: var(--cond); font-weight: 500; font-size: 11px; letter-spacing: .16em; display: flex; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(2px); transition: background .15s, border-color .15s; }
    .btn.on { background: rgba(232, 163, 61, .35); border-color: var(--amber); }
    .btn.hot { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 14px rgba(232, 163, 61, .35); }
    #btn-jump { right: max(26px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); width: 78px; height: 78px; }
    #btn-interact { right: calc(max(26px, env(safe-area-inset-right)) + 90px); bottom: max(26px, env(safe-area-inset-bottom)); }
    #btn-run { right: calc(max(26px, env(safe-area-inset-right)) + 6px); bottom: calc(max(34px, env(safe-area-inset-bottom)) + 92px); }
    #btn-torch { right: calc(max(26px, env(safe-area-inset-right)) + 84px); bottom: calc(max(26px, env(safe-area-inset-bottom)) + 80px); width: 52px; height: 52px; font-size: 9px; }

    /* title / pause */
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at 50% 60%, rgba(40, 28, 18, .78), rgba(10, 8, 6, .96)); transition: opacity .9s ease, visibility .9s; cursor: pointer; z-index: 5; padding: 24px; }
    #overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #overlay .label { margin-bottom: 16px; padding-left: .32em; }
    #overlay h1 { font-weight: 300; font-size: clamp(46px, 10vw, 104px); letter-spacing: .34em; padding-left: .34em; text-transform: uppercase; line-height: 1; }
    #overlay .rule { width: 84px; height: 1px; background: var(--amber); margin: 26px 0 22px; }
    #status { font-weight: 400; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); min-height: 22px; padding-left: .3em; }
    #status.ready { color: var(--ink); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    #bar { width: 220px; height: 1px; background: rgba(236, 230, 218, .18); margin-top: 16px; }
    #bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .25s; }
    #keys { margin-top: 38px; display: grid; grid-template-columns: auto auto; gap: 7px 18px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); text-align: left; }
    #keys b { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0; color: var(--amber); text-align: right; }
    body.mobile #keys { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <canvas id="compass"></canvas>
    <div id="objective">
      <div class="bar"></div>
      <div>
        <div class="label">Objective</div>
        <div id="obj-title"></div>
        <ul id="obj-list"></ul>
      </div>
    </div>
    <div id="stats"></div>
    <div id="toast"><div id="toast-sub"></div><div id="toast-main"></div></div>
    <div id="crosshair"></div>
    <div id="prompt"><span class="key">E</span><span id="prompt-text"></span></div>
    <div id="lore"></div>
    <div id="touch">
      <div id="stick"><div id="nub"></div></div>
      <div class="btn" id="btn-torch">TORCH</div>
      <div class="btn" id="btn-run">RUN</div>
      <div class="btn" id="btn-interact">INTERACT</div>
      <div class="btn" id="btn-jump">JUMP</div>
    </div>
  </div>

  <div id="overlay">
    <div class="label">A Viking village at golden hour</div>
    <h1>Fjordheim</h1>
    <div class="rule"></div>
    <div id="status">Loading</div>
    <div id="bar"><i></i></div>
    <div id="keys">
      <b>W A S D</b><span>Walk</span>
      <b>MOUSE</b><span>Look</span>
      <b>SHIFT</b><span>Run</span>
      <b>SPACE</b><span>Jump</span>
      <b>E</b><span>Interact</span>
      <b>F</b><span>Raise / lower torch</span>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
