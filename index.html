<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fjordheim — Viking Village Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1217;position:fixed;inset:0;width:100%;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;color:#f3ead8}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#tl{left:14px;top:12px}
#tl b{font-family:Cinzel,Georgia,serif;font-size:16px;letter-spacing:.16em;display:block}
#tl span{font-size:13px;opacity:.92}
#place{font-size:12px;opacity:.8;display:block;margin-top:2px;font-style:italic}
#map{position:absolute;right:12px;top:12px;width:108px;height:108px;border-radius:50%;
  border:2px solid rgba(243,234,216,.7);box-shadow:0 2px 12px rgba(0,0,0,.55);pointer-events:none}
#toast{left:50%;top:20%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .7s;width:90%}
#toast small{display:block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
#toast b{font-family:Cinzel,Georgia,serif;font-size:27px;letter-spacing:.06em}
#hint{left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;opacity:.85;white-space:nowrap;transition:opacity 1s}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  background:rgba(20,25,30,.15);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(243,234,216,.5)}
#jump{position:absolute;right:22px;bottom:34px;width:66px;height:66px;border-radius:50%;display:none;
  border:2px solid rgba(255,255,255,.4);background:rgba(20,25,30,.25);color:#f3ead8;
  font:700 12px Cinzel,Georgia,serif;letter-spacing:.1em;touch-action:none}
#helm{position:absolute;left:14px;top:76px;display:none;padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.4);background:rgba(20,25,30,.3);color:#f3ead8;font:700 10px Cinzel,Georgia,serif;letter-spacing:.14em;touch-action:none}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(8,12,16,.25),rgba(8,12,16,.8));text-align:center;padding:24px;transition:opacity .7s}
#start h1{font-family:Cinzel,Georgia,serif;font-size:clamp(38px,9vw,78px);margin:0;letter-spacing:.12em;text-shadow:0 3px 16px rgba(0,0,0,.8)}
#start p{max-width:30em;line-height:1.5;font-size:15px;margin:10px 0 0;opacity:.92;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.runes{letter-spacing:.5em;opacity:.7;font-size:18px;margin-bottom:6px}
#go{margin-top:24px;padding:13px 40px;font:700 16px Cinzel,Georgia,serif;letter-spacing:.2em;color:#1d1710;
  background:#e2c98f;border:0;border-radius:3px;box-shadow:0 3px 14px rgba(0,0,0,.5);cursor:pointer}
#intro{display:none}
#loading{margin-top:22px;width:min(300px,70vw)}
#ld{font-size:13px;font-style:italic;opacity:.85;margin-bottom:8px}
#track{height:3px;background:rgba(243,234,216,.2);border-radius:2px;overflow:hidden}
#bar{height:100%;width:0;background:#e2c98f;transition:width .3s}
#err{position:absolute;left:10px;bottom:10px;right:10px;color:#ffb4a0;font:12px monospace;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="tl"><b>FJORDHEIM</b><span id="count">Discovered 0 / 15</span><span id="place"></span></div>
<canvas id="map" width="224" height="224"></canvas>
<div class="hud" id="toast"><small id="toastS">Discovered</small><b id="toastB"></b></div>
<div class="hud" id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">JUMP</button>
<button id="helm">HELM</button>
<div id="start">
  <div class="runes">ᚠᛃᚢᚱᛞᚺᛖᛁᛗ</div>
  <h1>FJORDHEIM</h1>
  <div id="loading"><div id="ld">Waking the world</div><div id="track"><div id="bar"></div></div></div>
  <div id="intro">
    <p>A Norse village at the head of a fjord, in the last hour of sun. No enemy, no clock — walk the land and find its fifteen places.</p>
    <p id="how"></p>
    <button id="go">SET OUT</button>
  </div>
</div>
<div id="err"></div>
<script src="game.js"></script>
</body>
</html>
